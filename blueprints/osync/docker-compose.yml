# Osync — self-hosted, end-to-end encrypted sync server for Obsidian.
# Adapted from https://github.com/KORThomasJeong/Osync-p/blob/main/docker-compose.yml
#
# Differences from upstream:
#   * No container_name / host ports: Traefik routes via the domains in template.toml.
#   * minio/minio can no longer be pulled from Docker Hub, so it is replaced by
#     pgsty/silo, the maintained drop-in fork (same MINIO_* vars, same data format).
#     The non-distroless tag is used because it ships curl for the healthcheck.
#   * MINIO_SERVER_URL is wired to MINIO_PUBLIC_URL. The upstream README says the
#     compose file does this, but it doesn't; without it presigned uploads fail
#     with SignatureDoesNotMatch.
#   * The S3 store gets its own public domain, because the Obsidian plugin uploads
#     and downloads encrypted blobs directly via presigned URLs.
#   * On CPUs without AVX2 (e.g. Intel Celeron/Pentium) the API crashes with
#     "Illegal instruction": use the thomasjeong/osync:2.6.0-baseline image instead.

services:
  osync:
    image: thomasjeong/osync:2.6.0
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@osync-postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://osync-minio:9000
      COORDINATOR_DATA_DIR: /data/coordinators
    volumes:
      - osync-coordinator-data:/data/coordinators
    expose:
      - "3000"
    depends_on:
      osync-postgres:
        condition: service_healthy
      osync-minio:
        condition: service_healthy

  osync-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - osync-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  osync-minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      # Never change this after the first deploy, or stored blobs become unreadable.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
      MINIO_KMS_AUTO_ENCRYPTION: "on"
      MINIO_SERVER_URL: ${MINIO_PUBLIC_URL}
      MINIO_UPDATE: "off"
    volumes:
      - osync-minio-data:/data
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  osync-postgres-data:
  osync-minio-data:
  osync-coordinator-data:
